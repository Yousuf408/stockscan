name: Sync to Hugging Face
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.helper store
          echo "https://md1360408:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
          git remote add space https://huggingface.co/spaces/md1360408/smartswing
          git push --force space main
