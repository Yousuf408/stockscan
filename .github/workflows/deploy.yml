name: Sync to HF Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Push to HuggingFace Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_KEY }}
        run: |
          git config --global user.email "github@example.com"
          git config --global user.name "GitHub Actions"
          
          git remote add hf https://user:${HF_TOKEN}@huggingface.co/spaces/Md1360408/smartswing
          
          git push -f hf main
